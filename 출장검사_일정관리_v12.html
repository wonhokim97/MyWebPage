<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출장검사 일정 관리 시스템</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <style>
        /* 미세 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* 달력 인쇄 전용 CSS 스타일 정의 */
        @media print {
            body { background: white !important; color: black !important; }
            header, aside, footer, .no-print { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; width: 100% !important; height: auto !important; overflow: visible !important; }
            #calendar-grid { overflow: visible !important; height: auto !important; display: grid !important; gap: 4px !important; }
            .bg-white { background-color: #ffffff !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .bg-indigo-50 { background-color: #e0e7ff !important; }
            .text-indigo-700 { color: #4338ca !important; }
        }
        /* 인증 전에는 일정과 저장 도구를 표시하지 않습니다. */
        body:not(.app-authenticated) > header,
        body:not(.app-authenticated) > .flex.flex-1,
        body:not(.app-authenticated) > footer { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200 h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더: 입체적인 딥 인디고 그라데이션 및 로컬 폴더 제어반 통합 배치 -->
    <header class="flex justify-between items-center px-6 py-3.5 bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-900 text-white border-b-2 border-indigo-500 shrink-0 shadow-lg z-10 no-print">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-calendar-check text-indigo-400 text-2xl drop-shadow-[0_2px_8px_rgba(99,102,241,0.4)]"></i>
            <h1 class="text-lg font-bold tracking-tight drop-shadow-sm">출장검사 일정 시스템</h1>
        </div>
        
        <!-- 헤더 제어 기능 그룹 (로컬폴더 연동 -> 화면모드 설정 단추 순 배치) -->
        <div class="flex items-center space-x-5">
            <div id="profile-status-area" class="flex items-center">
                <button onclick="openPasswordModal()" id="active-profile-badge" class="hidden items-center gap-1.5 bg-slate-800/60 border border-slate-700/50 text-slate-200 px-2.5 py-1.5 rounded-full text-[10px] font-semibold hover:bg-slate-800">
                    <i class="fa-solid fa-user-shield text-[9px]"></i>
                    <span id="active-profile-label">ID</span>
                </button>
            </div>

            <!-- 로컬 폴더 자동 저장 연동 영역 (헤더 탑재용 컴팩트 뷰) -->
            <div id="folder-status-area" class="flex items-center">
                <!-- JS에 의해 상태별 UI 동적 렌더링 -->
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="openGitHubSettingsModal()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-slate-300 hover:text-white text-xs font-semibold transition-all shadow-inner active:scale-95" title="GitHub 저장 설정">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </button>
                <button onclick="uploadToGitHub()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 border border-emerald-500 text-white text-xs font-semibold transition-all shadow-inner active:scale-95" title="GitHub 저장소에 업로드">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>저장</span>
                </button>
                <button onclick="downloadFromGitHub()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 border border-indigo-500 text-white text-xs font-semibold transition-all shadow-inner active:scale-95" title="GitHub 저장소에서 불러오기">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span>불러오기</span>
                </button>
            </div>

            <!-- 화면 제어 메뉴 (아이콘 + 메뉴명 탑재) -->
            <div class="flex items-center space-x-2">
                <!-- 테마 토글 (라이트/다크) -->
                <button onclick="toggleTheme()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-slate-300 hover:text-white text-xs font-semibold transition-all shadow-inner active:scale-95" title="테마 변경">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                    <span id="theme-text">다크 모드</span>
                </button>
                <!-- 전체화면 토글 -->
                <button onclick="toggleFullscreen()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-slate-300 hover:text-white text-xs font-semibold transition-all shadow-inner active:scale-95" title="전체화면">
                    <i id="fullscreen-icon" class="fa-solid fa-expand"></i>
                    <span id="fullscreen-text">전체화면</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 새로 열 때마다 ID와 비밀번호를 확인합니다. -->
    <div id="app-login-modal" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 no-print">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-2xl w-[380px] max-w-[calc(100vw-2rem)] border border-slate-200 dark:border-slate-800">
            <h2 class="text-base font-bold mb-4">출장검사 일정 시스템 로그인</h2>
            <form id="app-login-form" class="space-y-3">
                <label class="block text-xs">사용자 ID
                    <input id="login-id" type="text" autocomplete="username" required class="mt-1 w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </label>
                <label class="block text-xs">비밀번호
                    <input id="login-password" type="password" autocomplete="current-password" required class="mt-1 w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </label>
                <p id="login-message" role="alert" class="text-xs text-rose-500 hidden"></p>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg">로그인</button>
            </form>
            <button id="login-setup-button" type="button" onclick="openPasswordModal()" class="hidden mt-3 w-full text-xs text-indigo-600">첫 사용: ID / 비밀번호 설정</button>
        </div>
    </div>

    <div id="github-settings-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 no-print">
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-2xl w-[480px] max-w-[calc(100vw-2rem)] border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800 dark:text-slate-100">GitHub 저장 설정</h3>
                <button onclick="closeGitHubSettingsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">GitHub 저장소</label>
                    <input id="github-repo-input" type="text" placeholder="owner/repository" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">브랜치</label>
                    <input id="github-branch-input" type="text" value="main" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">저장 파일 경로</label>
                    <input id="github-file-input" type="text" value="travel_enc.json" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">GitHub Personal Access Token</label>
                    <input id="github-token-input" type="password" placeholder="ghp_xxx 또는 github_pat_xxx" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-5">
                <button onclick="closeGitHubSettingsModal()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-xs">취소</button>
                <button onclick="saveGitHubSettings()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded text-xs shadow-md">저장</button>
            </div>
        </div>
    </div>

    <div id="password-profile-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[60] no-print">
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-2xl w-[460px] max-w-[calc(100vw-2rem)] border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800 dark:text-slate-100">ID / 비밀번호 설정</h3>
                <button onclick="closePasswordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">사용자 ID</label>
                    <input id="profile-id-input" type="text" placeholder="예: admin, user1" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">비밀번호</label>
                    <input id="profile-password-input" type="password" placeholder="비밀번호 입력" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">비밀번호 확인</label>
                    <input id="profile-password-confirm-input" type="password" placeholder="비밀번호 재입력" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/70 p-3">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">저장된 ID 목록</span>
                        <button type="button" onclick="clearAllPasswordProfiles()" class="text-[10px] text-rose-500 hover:text-rose-600 font-semibold">전체 삭제</button>
                    </div>
                    <div id="password-profile-list" class="space-y-1.5 max-h-28 overflow-y-auto"></div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-5">
                <button onclick="closePasswordModal()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-xs">취소</button>
                <button onclick="savePasswordProfile()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded text-xs shadow-md">저장</button>
            </div>
        </div>
    </div>

    <!-- 메인 레이아웃 (좌/중/우 3단 구성) -->
    <div class="flex flex-1 overflow-hidden">

        <!-- [좌측 패널] 전체 스크롤 완전 차단 (부드러운 내부 쉐도우 및 입체 카드형 폼) -->
        <aside class="w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-4 flex flex-col space-y-4 overflow-hidden shrink-0 no-print shadow-md">
            <!-- 일정 등록 영역 -->
            <div class="bg-slate-50 dark:bg-slate-800/40 p-3 rounded-xl border border-slate-200/60 dark:border-slate-800 shadow-sm">
                <h2 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                    <i class="fa-regular fa-square-plus text-indigo-500"></i>
                    <span>일정 등록</span>
                </h2>
                <div class="space-y-2">
                    <div>
                        <label class="block text-[10px] font-bold mb-0.5 text-slate-500 dark:text-slate-400">외주사</label>
                        <input type="text" id="schedule-company" list="company-options" autocomplete="off" placeholder="회사명 또는 직접 입력" class="w-full text-xs bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-xs transition-shadow">
                        <datalist id="company-options"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold mb-0.5 text-slate-500 dark:text-slate-400">출장검사자</label>
                        <input type="text" id="schedule-inspector" list="inspector-options" autocomplete="off" placeholder="검사자명 또는 직접 입력" class="w-full text-xs bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-xs transition-shadow">
                        <datalist id="inspector-options"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold mb-0.5 text-slate-500 dark:text-slate-400">검사 PJT</label>
                        <input type="text" id="schedule-pjt" list="pjt-options" autocomplete="off" placeholder="PJT명 또는 직접 입력" class="w-full text-xs bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-inner transition-shadow">
                        <datalist id="pjt-options"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold mb-0.5 text-slate-500 dark:text-slate-400">일정 내용</label>
                        <input type="text" id="schedule-title" maxlength="80" placeholder="예: 고객 미팅, 출장 준비" class="w-full text-xs bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-inner transition-shadow">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold mb-0.5 text-slate-500 dark:text-slate-400">출장 일자</label>
                        <input type="date" id="schedule-date" class="w-full text-xs bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-inner transition-shadow">
                    </div>
                    <p class="text-[9px] leading-relaxed text-slate-400">일자 더블클릭 또는 일정 내용을 입력해 자유롭게 등록할 수 있습니다.</p>
                    <button onclick="saveSchedule()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg transition-all shadow-md hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:shadow-md">
                        일정 등록
                    </button>
                </div>
            </div>

            <!-- 기준정보 관리는 전용 팝업에서 관리 -->
            <div class="border-t border-slate-200 dark:border-slate-800 pt-3 space-y-2">
                <h2 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                    <i class="fa-solid fa-sliders text-indigo-500"></i><span>기준정보 관리</span>
                </h2>
                <button onclick="openManagerModal('company')" class="w-full flex items-center justify-between px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-indigo-400 hover:text-indigo-600 transition-all text-xs font-semibold">
                    <span><i class="fa-solid fa-industry mr-2 text-indigo-500"></i>외주사 관리</span><i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
                <button onclick="openManagerModal('inspector')" class="w-full flex items-center justify-between px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-indigo-400 hover:text-indigo-600 transition-all text-xs font-semibold">
                    <span><i class="fa-solid fa-user-gear mr-2 text-indigo-500"></i>검사자 관리</span><i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
                <button onclick="openManagerModal('pjt')" class="w-full flex items-center justify-between px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-indigo-400 hover:text-indigo-600 transition-all text-xs font-semibold">
                    <span><i class="fa-solid fa-folder-tree mr-2 text-indigo-500"></i>검사 PJT 관리</span><i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </aside>

        <!-- [중앙 패널] 아웃룩형 월간 달력 -->
        <main class="flex-1 flex flex-col p-5 overflow-hidden">
            <!-- 달력 컨트롤 및 년월 표시 중앙 배치 -->
            <div class="flex justify-center items-center mb-3 shrink-0 w-full relative">
                
                <!-- 중앙에 완벽히 정렬된 일정 내비게이션 -->
                <div class="flex items-center space-x-2 bg-white dark:bg-slate-900 px-4 py-1.5 rounded-full border border-slate-200/60 dark:border-slate-800/80 shadow-md">
                    <button onclick="prevMonth()" class="p-1 px-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 hover:bg-indigo-500 hover:text-white transition-all text-xs shadow-xs active:scale-95" title="이전달">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button onclick="goToday()" class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800 hover:bg-indigo-500 hover:text-white transition-all text-[11px] font-bold active:scale-95">오늘</button>
                    <h2 id="calendar-title" class="text-lg font-extrabold tracking-tight text-slate-800 dark:text-slate-100 text-center px-4 min-w-[140px]">2026년 07월</h2>
                    <button onclick="nextMonth()" class="p-1 px-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 hover:bg-indigo-500 hover:text-white transition-all text-xs shadow-xs active:scale-95" title="다음달">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- 우측 인쇄 및 엑셀 저장 버튼 그룹 -->
                <div class="absolute right-0 flex space-x-1.5 no-print">
                    <button onclick="printCalendar()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg flex items-center space-x-1 shadow-md hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all" title="달력 출력">
                        <i class="fa-solid fa-print text-[10px]"></i>
                        <span>인쇄</span>
                    </button>
                    <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg flex items-center space-x-1 shadow-md hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all" title="일정 엑셀 파일 다운로드">
                        <i class="fa-solid fa-file-excel text-[10px]"></i>
                        <span>Excel 저장</span>
                    </button>
                </div>
            </div>

            <!-- 달력 본체 그리드 -->
            <div class="flex-1 flex flex-col bg-slate-200/60 dark:bg-slate-950 border border-slate-200 dark:border-slate-900 rounded-2xl overflow-hidden shadow-lg p-1.5">
                <!-- 요일 표시 헤더 -->

                'bg-amber-50/90 text-amber-700 border-amber-100/80 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-900/40 hover:bg-amber-100 dark:hover:bg-amber-900/50',

                'bg-rose-50/90 text-rose-700 border-rose-100/80 dark:bg-rose-950/40 dark:text-rose-300 dark:border-rose-900/40 hover:bg-rose-100 dark:hover:bg-rose-900/50',

            ];

                let hash = 0;

        function getKoreanLunarDate(date) {
            // 한국 음력 월 시작일을 기준으로 경과일을 계산합니다 (브라우저 시간대와 무관).
            const dayIndex = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(1900, 0, 1)) / 86400000);
            if (dayIndex >= 0 && dayIndex <= 55151) {
                let low = 0, high = koreanLunarMonthStarts.length - 1;
                while (low <= high) {
                    const mid = Math.floor((low + high) / 2);
                    if (koreanLunarMonthStarts[mid][0] <= dayIndex) low = mid + 1;
                    else high = mid - 1;
                }
                const [monthStart, month, leapFlag] = koreanLunarMonthStarts[high];
                const day = dayIndex - monthStart + 1;
                const isLeapMonth = Boolean(leapFlag);
                return {
                    month, day, isLeapMonth,
                    festival: isLeapMonth ? null : (lunarFestivals[`${month}-${day}`] || null)
                };
            }

            // 대조표 범위 밖에서는 브라우저의 중국 음력을 같은 양력 날짜로 조회합니다.

            const parts = new Intl.DateTimeFormat('en-US-u-ca-chinese', {
                month: 'numeric', day: 'numeric', timeZone: 'Asia/Seoul'
            }).formatToParts(new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12)));
            const monthText = parts.find(part => part.type === 'month')?.value || '';
            const month = parseInt(monthText, 10);
            const day = parseInt(parts.find(part => part.type === 'day')?.value || '', 10);
            const isLeapMonth = /bis|leap/i.test(monthText);
            return {
                month, day, isLeapMonth,
                festival: isLeapMonth ? null : (lunarFestivals[`${month}-${day}`] || null)
            };
        }

                async function getKey(password, salt) {
            const enc = new TextEncoder();
            const subtle = window.crypto.subtle || window.crypto.webkitSubtle;
            const keyMaterial = await subtle.importKey(
                'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
            );
            return subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(plainText, password) {
            const enc = new TextEncoder();
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const key = await getKey(password, salt);
            const subtle = window.crypto.subtle || window.crypto.webkitSubtle;
            const encrypted = await subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plainText));

            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);

            let binaryStr = '';
            const chunkSize = 8192;
            for (let i = 0; i < combined.length; i += chunkSize) {
                binaryStr += String.fromCharCode.apply(null, combined.subarray(i, i + chunkSize));
            }
            return btoa(binaryStr);
        }

        async function decryptData(cipherBase64, password) {
            try {
                const binaryStr = atob(cipherBase64);
                const combined = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    combined[i] = binaryStr.charCodeAt(i);
                }

                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const data = combined.slice(28);

                const key = await getKey(password, salt);
                const subtle = window.crypto.subtle || window.crypto.webkitSubtle;
                const decrypted = await subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                return new TextDecoder().decode(decrypted);
            } catch (error) {
                throw new Error('비밀번호가 맞지 않거나 데이터가 손상되었습니다.');
            }
        }

        function normalizeGithubRepoInput(rawValue) {
            if (!rawValue) return '';

            let value = rawValue.trim();
            value = value.replace(/^https?:\/\/github\.com\//i, '');
            value = value.replace(/^git@github\.com:/i, '');
            value = value.replace(/\/$/, '');
            value = value.split('?')[0].split('#')[0];
            value = value.replace(/^https?:\/\/+/i, '');
            value = value.replace(/\\/g, '/');

            const clean = value.split('/').map(part => part.trim()).filter(Boolean).join('/');
            return clean;
        }

        function saveGitHubSettings() {

        function getGithubRepoParts() {
            const config = loadGithubConfig();
            const repo = normalizeGithubRepoInput(config.repo || '');
            if (!repo || !repo.includes('/')) {
                throw new Error('GitHub 저장소 주소가 올바르지 않습니다. 예: owner/repository 또는 https://github.com/owner/repository');
            }

            const parts = repo.split('/').map(part => part.trim()).filter(Boolean);
            if (parts.length < 2) {
                throw new Error('GitHub 저장소 주소가 올바르지 않습니다. 예: owner/repository 또는 https://github.com/owner/repository');
            }

            const filePath = (config.filePath || getAppDataFileName()).trim().replace(/^\/+/, '') || getAppDataFileName();
            return {
                owner: parts[0],
                repoName: parts.slice(1).join('/'),
                branch: (config.branch || '').trim() || '',
                filePath: filePath.toLowerCase() === 'data.json' ? getAppDataFileName() : filePath,
                token: (config.token || '').trim()
            };
        }

        async function requestGithubRepoInfo(owner, repoName, token) {
            const url = `https://api.github.com/repos/${owner}/${repoName}`;
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': token ? `Bearer ${token}` : undefined,
                    'X-GitHub-Api-Version': '2022-11-28'
                }
            });

            if (response.status === 404) return null;
            if (!response.ok) {
                const message = await response.text();
                throw new Error(`GitHub 저장소 조회 실패: ${response.status} ${message}`);
            }

            return await response.json();
        }

        async function resolveGithubBranch(config) {
            const repoInfo = await requestGithubRepoInfo(config.owner, config.repoName, config.token);
            if (!repoInfo) {
                throw new Error('GitHub 저장소를 찾을 수 없습니다. owner/repository 또는 저장소 접근 권한을 확인해 주세요.');
            }

            const defaultBranch = (repoInfo.default_branch || 'main').trim() || 'main';
            const requestedBranch = (config.branch || defaultBranch).trim() || defaultBranch;

            const branchUrl = `https://api.github.com/repos/${config.owner}/${config.repoName}/branches/${encodeURIComponent(requestedBranch)}`;
            const branchResponse = await fetch(branchUrl, {
                method: 'GET',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': config.token ? `Bearer ${config.token}` : undefined,
                    'X-GitHub-Api-Version': '2022-11-28'
                }
            });

            if (branchResponse.status === 404) {
                if (requestedBranch !== defaultBranch) {
                    return { ...config, branch: defaultBranch };
                }
                throw new Error(`GitHub 브랜치 '${requestedBranch}'를 찾을 수 없습니다. 저장 설정의 브랜치를 확인해 주세요.`);
            }

            if (!branchResponse.ok) {
                const detail = await branchResponse.text();
                throw new Error(`GitHub 브랜치 확인 실패: ${branchResponse.status} ${detail}`);
            }

            return { ...config, branch: requestedBranch };
        }

        async function requestGithubFileInfo(url, token) {
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': token ? `Bearer ${token}` : undefined,
                    'X-GitHub-Api-Version': '2022-11-28'
                },
                cache: 'no-store'
            });

            if (response.status === 404) return null;
            if (!response.ok) {
                const message = await response.text();
                throw new Error(`GitHub 요청 실패: ${response.status} ${message}`);
            }

            return await response.json();
        }

        // 수동 저장과 30초 자동 저장이 겹치지 않도록 직렬화합니다.
        let githubUploadQueue = Promise.resolve();

        async function uploadToGitHub(options = {}) {
            const { silent = false } = options;
            const runUpload = async () => {
            try {
                const password = ensureAppPassword();
                const config = getGithubRepoParts();
                if (!config.token) {
                    if (!silent) {
                        alert('GitHub Personal Access Token을 먼저 저장해 주세요.');
                        openGitHubSettingsModal();
                    }
                    return false;
                }

                const resolvedConfig = await resolveGithubBranch(config);
                const repoUrl = `https://api.github.com/repos/${resolvedConfig.owner}/${resolvedConfig.repoName}/contents/${encodeURIComponent(resolvedConfig.filePath).replace(/%2F/g, '/')}`;
                const payload = JSON.stringify(getDatabasePayload(), null, 2);
                const encryptedPayload = await encryptData(payload, password);
                const content = btoa(String.fromCharCode(...new TextEncoder().encode(encryptedPayload)));

                async function performUploadWithRetry(maxAttempts = 6) {

                    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                        // 매회 원격 최신 SHA를 다시 가져오며 GET 캐시를 사용하지 않습니다.
                        const existing = await requestGithubFileInfo(
                            `${repoUrl}?ref=${encodeURIComponent(resolvedConfig.branch)}&_=${Date.now()}-${attempt}`,
                            resolvedConfig.token
                        );
                        const existingSha = existing && existing.sha ? existing.sha : null;
                        const body = {
                            message: `업데이트: ${new Date().toISOString()}`,
                            content,
                            branch: resolvedConfig.branch
                        };

                        if (existingSha) body.sha = existingSha;

                        const response = await fetch(repoUrl, {
                            method: 'PUT',
                            headers: {
                                'Accept': 'application/vnd.github+json',
                                'Authorization': `Bearer ${resolvedConfig.token}`,
                                'Content-Type': 'application/json',
                                'X-GitHub-Api-Version': '2022-11-28'
                            },
                            body: JSON.stringify(body)
                        });

                        if (response.ok) return response;

                        const errorText = await response.text();
                        let apiMessage = errorText;
                        try {
                            apiMessage = JSON.parse(errorText || '{}').message || errorText;
                        } catch (e) {
                            apiMessage = errorText || 'GitHub API 오류';
                        }

                        const isShaMismatch = (response.status === 409 || response.status === 422)
                            && /does not match|sha/i.test(apiMessage);

                        if (!isShaMismatch || attempt === maxAttempts) {
                            throw new Error(`GitHub 업로드 실패: ${response.status} ${apiMessage}`);
                        }

                        // 동시 저장으로 원격 SHA가 바뀐 경우 잠시 기다린 뒤 재조회합니다.
                        await new Promise(resolve => setTimeout(resolve, Math.min(400 * 2 ** (attempt - 1), 5000) + Math.random() * 200));
                    }

                    throw new Error('GitHub 업로드 실패: 원격 파일 버전 충돌이 반복되었습니다.');
                }

                await performUploadWithRetry();
                saveLocalDatabase();
                addLog(`GitHub에 암호화된 데이터가 저장되었습니다. (${resolvedConfig.owner}/${resolvedConfig.repoName}/${resolvedConfig.filePath})`);
                return true;
            } catch (error) {
                console.error(error);
                if (!silent) {
                    alert(`GitHub 저장 실패: ${error.message}`);
                }
                addLog(`GitHub 저장 실패: ${error.message}`);
                return false;
            }
            };

            // 동일 브라우저의 여러 탭도 같은 파일에 동시에 쓰지 않도록 잠급니다.
            const queued = githubUploadQueue.then(() => {
                if (navigator.locks?.request) {
                    const config = loadGithubConfig();
                    const lockName = `travel-github-upload:${normalizeGithubRepoInput(config.repo || '')}:${config.branch || 'main'}:${config.filePath || getAppDataFileName()}`;
                    return navigator.locks.request(lockName, runUpload);
                }
                return runUpload();
            });
            githubUploadQueue = queued.catch(() => {});
            return queued;
        }

        async function downloadFromGitHub(options = {}) {
            const { silent = false } = options;
            try {
                const password = ensureAppPassword();
                const config = getGithubRepoParts();
                if (!config.token) {
                    if (!silent) {
                        alert('GitHub Personal Access Token을 먼저 저장해 주세요.');
                        openGitHubSettingsModal();
                    }
                    return false;
                }

                const resolvedConfig = await resolveGithubBranch(config);
                const repoUrl = `https://api.github.com/repos/${resolvedConfig.owner}/${resolvedConfig.repoName}/contents/${encodeURIComponent(resolvedConfig.filePath).replace(/%2F/g, '/')}`;
                const response = await fetch(`${repoUrl}?ref=${encodeURIComponent(resolvedConfig.branch)}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${resolvedConfig.token}`,
                        'X-GitHub-Api-Version': '2022-11-28'
                    }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`GitHub 불러오기 실패: ${response.status} ${errorText}`);
                }

                const fileData = await response.json();
                if (!fileData || !fileData.content) {
                    throw new Error('GitHub 저장소에서 파일 내용을 찾을 수 없습니다.');
                }

                const decoded = decodeURIComponent(Array.from(atob(fileData.content.replace(/\n/g, '')))
                    .map(char => `%${('00' + char.charCodeAt(0).toString(16)).slice(-2)}`)
                    .join(''));

                let parsed = {};
                try {
                    const decrypted = await decryptData(decoded, password);
                    parsed = JSON.parse(decrypted);
                } catch (decryptError) {
                    try {
                        parsed = JSON.parse(decoded);
                        addLog('GitHub의 기존 평문 데이터가 감지되어 그대로 불러왔습니다.');
                    } catch (jsonError) {
                        throw new Error('GitHub 데이터 복호화 실패: 비밀번호가 올바르지 않거나 파일이 손상되었습니다.');
                    }
                }

                companies = Array.isArray(parsed.companies) ? parsed.companies : [...(companies || [])];
                inspectors = Array.isArray(parsed.inspectors) ? parsed.inspectors : [...(inspectors || [])];
                pjts = Array.isArray(parsed.pjts) ? parsed.pjts : [...(pjts || [])];
                schedules = Array.isArray(parsed.schedules) ? parsed.schedules : [...(schedules || [])];

                saveLocalDatabase();
                sortCompanies();
                sortPjts();
                updateBasicLists();
                initializeScheduleFormDefaults();
                renderCalendar();
                searchSchedules();
                addLog(`GitHub에서 암호화된 데이터를 불러왔습니다. (${resolvedConfig.owner}/${resolvedConfig.repoName}/${resolvedConfig.filePath})`);
                return true;
            } catch (error) {
                console.error(error);
                if (!silent) {
                    alert(`GitHub 불러오기 실패: ${error.message}`);
                }
                addLog(`GitHub 불러오기 실패: ${error.message}`);
                return false;
            }
        }

        async function autoSyncGitHub() {
            if (!hasGithubSyncSettings()) {
                return;
            }

            // 로컬 변경을 원격 저장소에만 전송합니다.
            // 시작 시 다운로드를 실행하지 않으면 기존 원격 데이터가 로컬 저장소를 덮어쓰는 문제를 방지합니다.
            await uploadToGitHub({ silent: true });
        }

        async function startAutoGitHubSync() {
            if (!hasGithubSyncSettings()) {
                return;
            }

            addLog('GitHub 자동 업로드가 초기화되었습니다.');

            setInterval(async () => {
                if (!hasGithubSyncSettings()) {
                    return;
                }
                await uploadToGitHub({ silent: true });
            }, 30000);
        }

        // IndexedDB 로컬 폴더 핸들 동기화 로직
        const DB_NAME = "LocalFolderSyncDB";
        const STORE_NAME = "settings";
        const KEY_NAME = "savedDirectoryHandle";

        function getIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    e.target.result.createObjectStore(STORE_NAME);
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveHandleToDB(handle) {
            const db = await getIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put(handle, KEY_NAME);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        async function getHandleFromDB() {
            const db = await getIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get(KEY_NAME);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function verifyPermission(fileHandle, readWrite) {
            const options = {};
            if (readWrite) options.mode = 'readwrite';
            if ((await fileHandle.queryPermission(options)) === 'granted') return true;
            if ((await fileHandle.requestPermission(options)) === 'granted') return true;
            return false;
        }

        async function connectFolder() {
            try {
                const selectedHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                dirHandle = selectedHandle;
                folderConnected = false;
                updateFolderUI('connected');
                await saveHandleToDB(dirHandle);
                await initFolderData();
            } catch (e) {
                if (e.name !== 'AbortError') {
                    folderConnected = false;
                    updateFolderUI('disconnected');
                    alert("로컬 폴더를 연결할 수 없습니다. 크롬/엣지 브라우저를 활용하고 있는지 확인해 주세요.");
                }
            }
        }

        async function tryAutoReconnect() {
            try {
                const savedHandle = await getHandleFromDB();
                if (savedHandle) {
                    dirHandle = savedHandle;
                    folderConnected = false;
                    const granted = await verifyPermission(dirHandle, true);
                    if (granted) {
                        await initFolderData();
                    } else {
                        updateFolderUI('pending');
                        addLog("이전에 연결된 작업 폴더를 감지했습니다. 상단 [🔓 승인]을 누르면 동기화됩니다.");
                    }
                } else {
                    updateFolderUI('disconnected');
                }
            } catch (e) {
                folderConnected = false;
                updateFolderUI('disconnected');
            }
        }

        async function approveReconnect() {
            if (!dirHandle) return;
            try {
                const granted = await verifyPermission(dirHandle, true);
                if (granted) {
                    await initFolderData();
                } else {
                    folderConnected = false;
                    addLog("보안 권한 거부. 브라우저 저장 모드로 계속 동작합니다.");
                    updateFolderUI('disconnected');
                }
            } catch (e) {
                folderConnected = false;
                addLog("보안 연동 실패. 폴더를 재선택해야 합니다.");
                updateFolderUI('disconnected');
            }
        }

        async function initFolderData() {
            try {
                const appDataFileName = getAppDataFileName();
                const legacyFileName = 'data.json';

                let fileHandle;
                try {
                    fileHandle = await dirHandle.getFileHandle(appDataFileName, { create: false });
                } catch (e) {
                    try {
                        fileHandle = await dirHandle.getFileHandle(legacyFileName, { create: false });
                    } catch (legacyErr) {
                        fileHandle = await dirHandle.getFileHandle(appDataFileName, { create: true });
                    }
                }

                const file = await fileHandle.getFile();
                const fileText = await file.text();

                if (fileText.trim()) {
                    try {
                        const decryptedText = await decryptData(fileText, ensureAppPassword());
                        const data = JSON.parse(decryptedText);
                        companies = data.companies || ["삼성전자", "LG화학", "SK하이닉스"];
                        inspectors = data.inspectors || ["홍길동 과장", "이몽룡 대리", "성춘향 주임"];
                        schedules = data.schedules || [];
                        pjts = data.pjts || [...new Set(schedules.map(s => (s.pjt || '').trim()).filter(Boolean))];
                    } catch (decryptError) {
                        try {
                            const data = JSON.parse(fileText);
                            companies = data.companies || ["삼성전자", "LG화학", "SK하이닉스"];
                            inspectors = data.inspectors || ["홍길동 과장", "이몽룡 대리", "성춘향 주임"];
                            schedules = data.schedules || [];
                            pjts = data.pjts || [...new Set(schedules.map(s => (s.pjt || '').trim()).filter(Boolean))];
                            await saveDatabase();
                            addLog("기존 평문 폴더 데이터가 감지되어 자동 암호화 저장이 적용되었습니다.");
                        } catch (parseError) {
                            console.error(parseError);
                            throw new Error('데이터 복호화 실패: 비밀번호가 올바르지 않거나 파일이 손상되었습니다.');
                        }
                    }

                    folderConnected = true;
                    saveLocalDatabase();
                    addLog("폴더 자동 저장 활성화 ('" + dirHandle.name + "' 연동됨)");
                } else {
                    folderConnected = true;
                    await saveDatabase();
                    addLog("기존 작성 데이터를 '" + dirHandle.name + "/" + getAppDataFileName() + "'에 저장했습니다.");
                }

                updateFolderUI('connected');
                sortCompanies();
                sortPjts();
                updateBasicLists();
                initializeScheduleFormDefaults();
                renderCalendar();
                searchSchedules();
            } catch (e) {
                folderConnected = false;
                console.error("폴더 데이터 초기화 실패:", e);
                addLog(`폴더 데이터 초기화 실패: ${e.message || '알 수 없는 오류'}`);
                updateFolderUI('disconnected');
            }
        }

        async function loadFallbackData() {
            const lCompanies = localStorage.getItem('co_db');
            const lInspectors = localStorage.getItem('ins_db');
            const lSchedules = localStorage.getItem('sch_db');

            companies = lCompanies ? JSON.parse(lCompanies) : ["삼성전자", "LG화학", "SK하이닉스"];
            inspectors = lInspectors ? JSON.parse(lInspectors) : ["홍길동 과장", "이몽룡 대리", "성춘향 주임"];
            schedules = lSchedules ? JSON.parse(lSchedules) : [];
            const lPjts = localStorage.getItem('pjt_db');
            pjts = lPjts ? JSON.parse(lPjts) : [...new Set(schedules.map(s => (s.pjt || '').trim()).filter(Boolean))];

            sortCompanies();
            sortPjts();
            updateBasicLists();
            initializeScheduleFormDefaults();
            renderCalendar();
            searchSchedules();
            addLog("출장검사 관리 프로그램이 초기화되었습니다.");
        }

        // 폴더 연결 여부와 관계없이 브라우저에도 항상 백업합니다.
        function saveLocalDatabase() {
            localStorage.setItem('co_db', JSON.stringify(companies));
            localStorage.setItem('ins_db', JSON.stringify(inspectors));
            localStorage.setItem('pjt_db', JSON.stringify(pjts));
            localStorage.setItem('sch_db', JSON.stringify(schedules));
        }

        async function saveDatabase() {
            saveLocalDatabase();

            if (folderConnected && dirHandle) {
                try {
                    const dataFileName = getAppDataFileName();
                    const fileHandle = await dirHandle.getFileHandle(dataFileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    const payload = { companies, inspectors, pjts, schedules };
                    const encrypted = await encryptData(JSON.stringify(payload, null, 2), ensureAppPassword());
                    await writable.write(encrypted);
                    await writable.close();
                    addLog("실시간 자동 저장 완료 (" + dirHandle.name + "/" + dataFileName + ")");
                    return;
                } catch (e) {
                    folderConnected = false;
                    updateFolderUI('pending');
                    addLog("폴더 쓰기 권한이 잠겨 브라우저에만 저장했습니다.");
                    return;
                }
            }

            addLog("브라우저 내 실시간 임시 저장 완료");
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#039;'}[char]));
        }

        // 데이터 변경 전 폴더 연결 및 쓰기 권한 승인 여부를 확인합니다.
        async function requireFolderApproval() {
            if (!dirHandle) {
                const message = '데이터를 입력하려면 먼저 상단의 [로컬 폴더 연결] 버튼으로 폴더를 연결하고 권한을 승인해 주세요.';
                alert(message);
                addLog('폴더 연결 승인 전 입력이 차단되었습니다.');
                return false;
            }

            const hasWritePermission = await verifyPermission(dirHandle, true);
            if (!hasWritePermission) {
                const message = '폴더 연결 권한 승인이 필요합니다. 상단의 [🔓 승인] 버튼을 눌러 승인한 후 입력해 주세요.';
                alert(message);
                addLog('폴더 연결 승인 전 입력이 차단되었습니다.');
                folderConnected = false;
                updateFolderUI('pending');
                return false;
            }

            folderConnected = true;
            updateFolderUI('connected');
            return true;
        }

        function getManagerData() {
            return activeManager === 'company' ? companies : activeManager === 'inspector' ? inspectors : pjts;
        }

        function getManagerTitle() {
            return activeManager === 'company' ? '외주사 관리' : activeManager === 'inspector' ? '검사자 관리' : '검사 PJT 관리';
        }

        function openManagerModal(type) {

            document.getElementById('manager-modal').classList.add('hidden');

            editingManagerIndex = null;
        }

        function resetManagerForm() {
            editingManagerIndex = null;
            const input = document.getElementById('manager-input');
            if (input) input.value = '';
            const saveBtn = document.getElementById('manager-save-btn');
            if (saveBtn) saveBtn.innerText = '추가';

            if (cancelBtn) cancelBtn.classList.add('hidden');

                        <button onclick="deleteManagerItem(${index})" class="text-rose-500 hover:bg-rose-50 dark:hover:bg-slate-700 p-1.5 rounded" title="삭제"><i class="fa-solid fa-trash-can"></i></button>

        function startManagerEdit(index) {
            editingManagerIndex = index;
            const data = getManagerData();
            document.getElementById('manager-input').value = data[index];
            document.getElementById('manager-save-btn').innerText = '수정 저장';
            document.getElementById('manager-cancel-btn').classList.remove('hidden');

        }

        async function saveManagerItem() {
            if (!(await requireFolderApproval())) return;
            const input = document.getElementById('manager-input');
            const value = input.value.trim();
            if (!value) return;
            const data = getManagerData();
            const oldValue = editingManagerIndex !== null ? data[editingManagerIndex] : null;
            if (data.includes(value) && value !== oldValue) {
                alert('이미 등록된 항목입니다.');
                return;
            }
            if (editingManagerIndex === null) data.push(value);
            else {
                data[editingManagerIndex] = value;
                if (activeManager === 'company') schedules.forEach(s => { if (s.company === oldValue) s.company = value; });
                if (activeManager === 'inspector') schedules.forEach(s => { if (s.inspector === oldValue) s.inspector = value; });
                if (activeManager === 'pjt') schedules.forEach(s => { if (s.pjt === oldValue) s.pjt = value; });
            }
            if (activeManager === 'company') sortCompanies();
            if (activeManager === 'pjt') sortPjts();
            await saveDatabase();
            updateBasicLists();
            renderManagerList();
            renderCalendar();
            searchSchedules();
            resetManagerForm();
        }

        async function deleteManagerItem(index) {
            if (!(await requireFolderApproval())) return;
            const data = getManagerData();
            const value = data[index];
            if (!confirm(`'${value}' 항목을 삭제하시겠습니까?`)) return;
            data.splice(index, 1);
            await saveDatabase();
            updateBasicLists();
            renderManagerList();
            renderCalendar();
            searchSchedules();
        }

        // 달력 렌더링
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            document.getElementById('calendar-title').innerText = `${currentYear}년 ${String(currentMonth + 1).padStart(2, '0')}월`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

            // 이전 달 날짜 채우기
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[100px] p-2 bg-slate-50/40 dark:bg-slate-900/10 text-slate-300 dark:text-slate-700 rounded-xl border border-transparent text-xs font-medium';
                dayDiv.innerText = new Date(currentYear, currentMonth, 0).getDate() - i;
                grid.appendChild(dayDiv);
            }

            // 해당 월의 실제 날짜와 일정 채우기
            for (let day = 1; day <= lastDate; day++) {
                const dateString = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const holidayName = getHoliday(dateString);
                const lunarDate = getLunarDate(new Date(currentYear, currentMonth, day));
                const festivalName = lunarDate.festival || holidayName;
                const isNationalArmedForcesDay = !holidayName && dateString.endsWith('-10-01');
                
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[100px] p-2 bg-white dark:bg-slate-900 rounded-xl border border-slate-200/50 dark:border-slate-800 flex flex-col justify-between group shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 cursor-pointer';
                dayDiv.setAttribute('onclick', `selectDate('${dateString}')`);
                dayDiv.addEventListener('dblclick', () => openScheduleForm(dateString));

                const today = new Date();
                const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === day;
                
                let dateNumClass = 'text-sm font-bold mb-1 w-6 h-6 flex items-center justify-center rounded-full';
                if (isToday) {
                    dateNumClass += ' bg-indigo-600 text-white shadow-md shadow-indigo-500/30';
                } else {
                    const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();
                    if (dayOfWeek === 0 || holidayName) dateNumClass += ' text-rose-500';
                    else if (dayOfWeek === 6) dateNumClass += ' text-blue-500';
                    else dateNumClass += ' text-slate-700 dark:text-slate-300';
                }

                dayDiv.innerHTML = `
                    <div class="flex items-start justify-between gap-1 shrink-0">
                        <span class="${dateNumClass}">${day}</span>
                        <div class="flex min-w-0 flex-1 items-start justify-end gap-1.5">
                            <span class="truncate text-[9px] font-medium text-slate-500 dark:text-slate-400">${lunarDate.isLeapMonth ? "윤" : ""}${lunarDate.month}.${lunarDate.day}</span>
                            ${festivalName || isNationalArmedForcesDay ? `<span class="max-w-[58px] truncate text-right text-[9px] font-bold text-amber-600 dark:text-amber-400">${festivalName || '국군의 날'}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex-1 space-y-1 overflow-y-auto max-h-[70px] mt-1" id="events-${dateString}"></div>
                `;

                grid.appendChild(dayDiv);

                const daySchedules = schedules.filter(s => s.date === dateString);
                const eventContainer = dayDiv.querySelector(`#events-${dateString}`);
                
                daySchedules.forEach(sched => {
                    // [변경 핵심] 검사자 고유 테마 6가지 프리셋 매핑 함수
                    const colorClasses = getInspectorColorClasses(sched.inspector || '자유 일정');
                    
                    const eventEl = document.createElement('div');
                    eventEl.className = `text-[11px] px-1.5 py-1 rounded-md font-bold flex justify-between items-start shadow-xs border break-all whitespace-normal transition-all duration-150 leading-relaxed ${colorClasses}`;
                    
                    const calendarDisplayText = sched.title || `${sched.company || '자유 일정'}${sched.company && sched.inspector ? ' • ' + sched.inspector : ''}`;
                    const tooltipText = `외주사: ${sched.company || '없음'}\n검사자: ${sched.inspector || '없음'}\n검사 PJT: ${sched.pjt || '없음'}\n일정 내용: ${sched.title || '없음'}\n출장일자: ${sched.date}`;

                    eventEl.innerHTML = `
                        <span class="flex-1 pr-1 font-bold animate-fadeIn" title="${tooltipText}">${calendarDisplayText}</span>
                        <button onclick="deleteSchedule(${sched.id}, event)" class="opacity-0 group-hover:opacity-100 ml-0.5 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 transition-opacity shrink-0 mt-0.5"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    eventContainer.appendChild(eventEl);
                });
            }

            // 다음 달 날짜 채우기
            for (let i = 1; i <= (42 - (firstDayIndex + lastDate)) % 7; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[100px] p-2 bg-slate-50/40 dark:bg-slate-900/10 text-slate-300 dark:text-slate-700 rounded-xl border border-transparent text-xs font-medium';
                dayDiv.innerText = i;
                grid.appendChild(dayDiv);
            }
        }

        // 날짜 클릭 시 동작 (메시지 연동 포함)
        function selectDate(dateString) {
            document.getElementById('schedule-date').value = dateString;
            const holidayName = getHoliday(dateString);
            const lunarDate = getLunarDisplay(dateString);
            
            const daySchedules = schedules.filter(s => s.date === dateString);
            let scheduleLog = "";
            if (daySchedules.length > 0) {
                scheduleLog = " [당일 일정: " + daySchedules.map(s => `"${s.title || s.company || '자유 일정'}"`).join(", ") + "]";
            }

            if (holidayName) {
                alert(`🎉 ${dateString}은(는) 대한민국 국경일/기념일 [ ${holidayName} ] 입니다. 음력: ${lunarDate}`);
                addLog(`일자 선택: ${dateString}은(는) [ ${holidayName} ] 입니다. 음력: ${lunarDate}.${scheduleLog}`);
            } else {
                addLog(`일자 선택: ${dateString}이(가) 등록 준비용 날짜로 선택되었습니다. 음력: ${lunarDate}.${scheduleLog}`);
            }
        }

        function openScheduleForm(dateString) {
            document.getElementById('schedule-date').value = dateString;
            document.getElementById('schedule-company').value = '';
            document.getElementById('schedule-inspector').value = '';
            document.getElementById('schedule-pjt').value = '';
            document.getElementById('schedule-title').focus({ preventScroll: true });
            document.querySelector('.no-print aside').scrollIntoView({ behavior: 'smooth', block: 'start' });
            addLog(`${dateString} 날짜로 자유 일정 등록 폼을 열었습니다.`);
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
            searchSchedules();
            addLog(`${currentYear}년 ${currentMonth + 1}월로 이동하였습니다.`);
        }
        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
            searchSchedules();
            addLog(`${currentYear}년 ${currentMonth + 1}월로 이동하였습니다.`);
        }
        function goToday() {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar();
            searchSchedules();
            addLog(`오늘 날짜(${currentYear}년 ${currentMonth + 1}월)로 이동하였습니다.`);
        }

        async function saveSchedule() {
            if (!(await requireFolderApproval())) return;
            const company = document.getElementById('schedule-company').value;
            const inspector = document.getElementById('schedule-inspector').value;
            const pjt = document.getElementById('schedule-pjt').value.trim();
            const title = document.getElementById('schedule-title').value.trim();
            const date = document.getElementById('schedule-date').value;

            if (!date || (!title && !company && !inspector)) {
                alert("일정 내용 또는 외주사/검사자 중 하나를 입력하고 출장일자를 선택해 주세요.");
                return;
            }

            const newId = schedules.length > 0 ? Math.max(...schedules.map(s => s.id)) + 1 : 1;
            const newSchedule = { id: newId, company, inspector, date, pjt, title };
            schedules.push(newSchedule);

            document.getElementById('schedule-title').value = '';
            document.getElementById('schedule-date').value = '';
            document.getElementById('schedule-company').value = '';
            document.getElementById('schedule-inspector').value = '';
            document.getElementById('schedule-pjt').value = '';

            await saveDatabase();
            renderCalendar();
            searchSchedules();
        }

        async function deleteSchedule(id, event) {
            if (!(await requireFolderApproval())) return;
            if (event) event.stopPropagation();
            const index = schedules.findIndex(s => s.id === id);
            if (index !== -1) {
                schedules.splice(index, 1);
                await saveDatabase();
                renderCalendar();
                searchSchedules();
            }
        }

        function openEditModal(id, event) {
            if (event) event.stopPropagation();
            const sched = schedules.find(s => s.id === id);
            if (!sched) return;

            document.getElementById('edit-schedule-id').value = sched.id;
            document.getElementById('edit-schedule-company').value = sched.company;
            document.getElementById('edit-schedule-inspector').value = sched.inspector;
            document.getElementById('edit-schedule-pjt').value = sched.pjt || '';
            document.getElementById('edit-schedule-date').value = sched.date;

            document.getElementById('edit-modal').classList.remove('hidden');
            addLog("일정 수정 모달 창을 열었습니다.");
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function updateSchedule() {
            if (!(await requireFolderApproval())) return;
            const id = parseInt(document.getElementById('edit-schedule-id').value);
            const company = document.getElementById('edit-schedule-company').value;
            const inspector = document.getElementById('edit-schedule-inspector').value;
            const pjt = document.getElementById('edit-schedule-pjt').value.trim();
            const date = document.getElementById('edit-schedule-date').value;

            if (!company || !inspector || !date) {
                alert("외주사, 검사자, 출장일자는 필수 선택사항입니다.");
                return;
            }

            const sched = schedules.find(s => s.id === id);
            if (sched) {
                sched.company = company;
                sched.inspector = inspector;
                sched.pjt = pjt;
                sched.date = date;

                await saveDatabase();
                closeEditModal();
                renderCalendar();
                searchSchedules();
            }
        }

        function printCalendar() {
            window.print();
        }

        function exportToExcel() {
            if (schedules.length === 0) {
                alert("엑셀로 다운로드할 일정이 존재하지 않습니다.");
                return;
            }
            let csvContent = "\uFEFF순번,외주사,출장검사자,검사 PJT,일정 내용,출장일자\n";
            const sorted = [...schedules].sort((a, b) => new Date(a.date) - new Date(b.date));
            sorted.forEach((s, idx) => {
                csvContent += [idx + 1, `"${s.company || ''}"`, `"${s.inspector || ''}"`, `"${s.pjt || ''}"`, `"${s.title || ''}"`, s.date].join(",") + "\n";
            });
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `출장검사일정_리포트_${currentYear}년_${currentMonth + 1}월.csv`;
            link.click();
        }

        function setSearchScope(scope) {
            searchScope = scope;
            document.getElementById('search-scope-month').className = `text-[11px] font-bold py-1.5 rounded-md ${scope === 'month' ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`;
            document.getElementById('search-scope-all').className = `text-[11px] font-bold py-1.5 rounded-md ${scope === 'all' ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`;
            searchSchedules();
        }

        function searchSchedules() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const resultsContainer = document.getElementById('search-results');
            const monthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            document.getElementById('search-scope-label').innerText = searchScope === 'month' ? `${currentYear}년 ${currentMonth + 1}월 일정 표시` : '전체 기간 일정 표시';

            // 자유 일정과 출장 일정 모두 검색 대상이 되도록 설정합니다.
            const filtered = schedules.filter(s => {
                const company = String(s.company || '').trim();
                const inspector = String(s.inspector || '').trim();
                const pjt = String(s.pjt || '').trim();
                const title = String(s.title || '').trim();
                const date = String(s.date || '').trim();

                const isValid = Boolean(date) && (Boolean(title) || Boolean(company && inspector));
                const matchesText = company.toLowerCase().includes(query) || inspector.toLowerCase().includes(query) || pjt.toLowerCase().includes(query) || title.toLowerCase().includes(query);
                const matchesScope = searchScope === 'all' || date.startsWith(monthKey);

                return isValid && matchesText && matchesScope;
            }).sort((a, b) => new Date(a.date) - new Date(b.date));

            if (!filtered.length) {
                resultsContainer.innerHTML = `<div class="text-center py-6 text-slate-400 text-[11px]">${searchScope === 'month' ? '해당월' : '전체'} 검색 결과가 존재하지 않습니다.</div>`;
                return;
            }
            resultsContainer.innerHTML = filtered.map(s => `
                <div class="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200/60 dark:border-slate-700 hover:border-indigo-500 hover:shadow-md hover:-translate-y-0.5 cursor-pointer transition-all duration-200 shadow-xs" onclick="focusDate('${s.date}')">
                    <div class="flex justify-between items-start mb-0.5">
                        <span class="font-bold text-xs truncate text-slate-800 dark:text-slate-100">${escapeHtml(s.title || s.company)}</span>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <button onclick="openEditModal(${s.id}, event)" class="text-slate-400 hover:text-amber-500 transition-colors text-xs" title="수정"><i class="fa-solid fa-pen-to-square text-[10px]"></i></button>
                            <button onclick="deleteSchedule(${s.id}, event)" class="text-slate-400 hover:text-rose-500 transition-colors text-xs" title="삭제"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                        </div>
                    </div>
                    <div class="text-[11px] text-slate-500 dark:text-slate-400 flex flex-col space-y-0.5">
                        <span>${escapeHtml(s.company || '자유 일정')}</span>
                        <span>검사자: ${escapeHtml(s.inspector || '없음')}</span>
                        <span class="font-mono text-slate-400 text-[10px]">${s.date}</span>
                        ${s.pjt ? `<div class="text-[9px] text-indigo-600 dark:text-indigo-400 font-bold mt-1 bg-indigo-50 dark:bg-indigo-950/40 px-1.5 py-0.5 rounded-md truncate max-w-full border border-indigo-100/40 dark:border-indigo-900/20">${escapeHtml(s.pjt)}</div>` : ''}
                    </div>
                </div>`).join('');
        }

        function focusDate(dateStr) {
            const targetDate = new Date(dateStr);
            currentYear = targetDate.getFullYear();
            currentMonth = targetDate.getMonth();
            renderCalendar();
            searchSchedules();
            addLog(`달력 초점이 ${dateStr}로 변경되었습니다.`);
        }

        // 로딩 생명주기 제어
        window.onload = () => {
            initializeLoginScreen();
        };
    </script>
</body>
</html>
