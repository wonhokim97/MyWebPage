<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루브르 & 메트로폴리탄: 프리미엄 아트 갤러리 시뮬레이터</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+KR:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body {
            font-family: 'Inter', 'Noto Serif KR', sans-serif;
            overflow: hidden;
            user-select: none;
            background-color: #0f1115;
            transition: background-color 0.8s ease, background-image 0.8s ease;
        }

        .art-title-font {
            font-family: 'Playfair Display', 'Noto Serif KR', serif;
        }

        #art-frame {
            box-sizing: content-box !important;
            display: block;
            margin: auto;
        }

        /* 명품 수공예 액자 스타일 모음 */
        .frame-antique-wood {
            border: 28px solid #4a2810;
            border-image: linear-gradient(135deg, #6b3e1d 0%, #2b180a 40%, #4a2810 60%, #150903 100%) 28;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 30px 60px rgba(0, 0, 0, 0.85), 0 15px 25px rgba(0, 0, 0, 0.6);
            background: #f4f1ea;
            transition: all 0.5s ease;
        }

        .frame-royal-gold {
            border: 26px solid #c9a044;
            border-image: linear-gradient(135deg, #fcefa7 0%, #c9a044 25%, #ebd17a 50%, #876211 75%, #ebd17a 100%) 26;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7), 0 35px 70px rgba(0, 0, 0, 0.75), 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #fbfaf5;
            transition: all 0.5s ease;
        }

        .frame-modern-black {
            border: 20px solid #1c1d21;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05), inset 0 0 20px rgba(0, 0, 0, 0.95), 0 25px 50px rgba(0, 0, 0, 0.9);
            background: #ffffff;
            transition: all 0.5s ease;
        }

        .frame-minimal-white {
            border: 14px solid #ffffff;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.1), 0 20px 45px rgba(0, 0, 0, 0.3);
            background: #fafafa;
            transition: all 0.5s ease;
        }

        .frame-royal-crimson {
            border: 26px solid #1c1c1c;
            border-image: linear-gradient(to bottom, #303030, #0a0a0a) 26;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.95), 0 35px 65px rgba(0, 0, 0, 0.85);
            background: #610d18;
            transition: all 0.5s ease;
        }

        .frame-cyber-neon {
            border: 8px solid #0f172a;
            box-shadow: 0 0 20px #06b6d4, 0 0 40px #3b82f6, inset 0 0 15px #06b6d4;
            background: #111827;
            animation: cyber-pulsate 4s infinite alternate;
            transition: all 0.5s ease;
        }

        @keyframes cyber-pulsate {
            0% {
                box-shadow: 0 0 15px #06b6d4, 0 0 30px #3b82f6, inset 0 0 12px #06b6d4;
            }

            100% {
                box-shadow: 0 0 30px #d946ef, 0 0 50px #8b5cf6, inset 0 0 20px #d946ef;
            }
        }

        /* 미술관 전용 다크모드 벽지 디자인 */
        .wall-marble {
            background-color: #d8d8d8;
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=1920&q=50');
            background-size: cover;
            background-position: center;
        }

        .wall-cozy-wood {
            background-color: #2b1d12;
            background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1541123437800-1bb1317badc2?auto=format&fit=crop&w=1920&q=50');
            background-size: cover;
            background-position: center;
        }

        .wall-concrete {
            background-color: #1a1e24;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.75)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=50');
            background-size: cover;
            background-position: center;
        }

        .wall-velvet-dark {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at center, #1e2538 0%, #060911 100%);
        }

        /* 라이트 모드 전용 전시장 벽지 */
        .wall-light-mode {
            background-color: #f8fafc;
            background-image: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
        }

        /* 조명 광학 효과 오버레이 */
        .spotlight-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            transition: background 1.5s ease-in-out;
        }

        .spot-white {
            background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.22) 0%, rgba(0, 0, 0, 0.85) 70%, rgba(0, 0, 0, 0.95) 100%);
        }

        .spot-warm {
            background: radial-gradient(circle at 50% 40%, rgba(253, 224, 71, 0.25) 0%, rgba(234, 179, 8, 0.08) 35%, rgba(0, 0, 0, 0.85) 75%, rgba(0, 0, 0, 0.98) 100%);
        }

        .spot-candle {
            background: radial-gradient(circle at 50% 45%, rgba(249, 115, 22, 0.3) 0%, rgba(124, 45, 18, 0.05) 30%, rgba(0, 0, 0, 0.9) 65%, rgba(0, 0, 0, 1) 100%);
        }

        .spot-off {
            background: rgba(0, 0, 0, 0.4);
        }

        .spot-light-mode {
            background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.85) 0%, rgba(0, 0, 0, 0.08) 100%);
        }

        /* UI 유휴(Idle) 시 숨김 처리 트랜지션 */
        .ui-element {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        body.idle header.ui-element {
            opacity: 0;
            transform: translateY(-25px);
            pointer-events: none;
        }

        body.idle footer.ui-element {
            opacity: 0;
            transform: translate(-50%, 25px);
            pointer-events: none;
        }

        body.idle .museum-plaque.ui-element {
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
        }

        body.idle .hotspot-btn {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 명화 전환을 위한 특수 연출 CSS */
        .effect-dissolve {
            transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .effect-dissolve.hide {
            opacity: 0;
            transform: scale(0.97);
        }

        .effect-slide {
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .effect-slide.hide {
            opacity: 0;
            transform: translateX(60px);
        }

        .effect-zoom {
            transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .effect-zoom.hide {
            opacity: 0;
            transform: scale(1.08);
        }

        .effect-flash {
            transition: opacity 0.35s ease, filter 0.35s ease;
        }

        .effect-flash.hide {
            opacity: 0.15;
            filter: brightness(2.8) contrast(0.75);
        }

        .effect-cut {
            transition: none !important;
        }

        .effect-cut.hide {
            opacity: 0;
        }
    </style>
</head>

<body class="wall-velvet-dark h-screen w-screen flex flex-col justify-between relative select-none">

    <div id="gallery-spotlight" class="spotlight-overlay spot-warm"></div>

    <header
        class="ui-element absolute top-0 left-0 w-full p-6 flex justify-between items-center z-40 pointer-events-none">
        <div
            class="bg-black/60 backdrop-blur-xl px-4 py-2 rounded-xl text-white border border-white/10 flex items-center gap-3 shadow-2xl pointer-events-auto">
            <i class="fa-solid fa-hotel text-amber-400"></i>
            <span class="text-xs font-semibold tracking-wider uppercase art-title-font">LOUVRE ROYAL ATELIER</span>
            <div class="h-3 w-px bg-white/20"></div>
            <span id="resolution-badge" class="text-[10px] text-gray-400 font-mono flex items-center">
                <i class="fa-solid fa-display text-amber-400 mr-1"></i> 감지 중...
            </span>
        </div>

        <div
            class="bg-black/60 backdrop-blur-xl px-4 py-2 rounded-xl text-white border border-white/10 flex items-center gap-3 shadow-2xl pointer-events-auto">
            <span id="slide-index-badge" class="text-xs font-bold text-gray-300">0 / 0</span>
            <div class="h-3 w-px bg-white/20"></div>
            <!-- 실시간 오디오 앰비언트 표시기 -->
            <div id="ambient-wave" class="flex gap-1 items-end h-3 hidden">
                <span class="w-0.5 bg-amber-400 animate-[pulse_0.8s_infinite] h-2"></span>
                <span class="w-0.5 bg-amber-400 animate-[pulse_1.2s_infinite] h-3"></span>
                <span class="w-0.5 bg-amber-400 animate-[pulse_0.9s_infinite] h-1"></span>
            </div>
            <button onclick="GalleryManager.toggleAmbientMusic()" id="btn-ambient-toggle"
                class="text-[10px] bg-white/10 hover:bg-amber-500 hover:text-black transition-colors duration-200 px-2 py-0.5 rounded text-amber-300 flex items-center gap-1">
                <i class="fa-solid fa-music"></i> <span>앰비언트 켜기</span>
            </button>
            <div class="h-3 w-px bg-white/20"></div>
            <span id="slideshow-state-indicator" class="flex h-2 w-2 relative">
                <span
                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
            </span>
            <span id="slideshow-state-text" class="text-[11px] font-medium text-amber-400">자동 감상 중</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-2 md:p-6 relative overflow-hidden w-full h-full z-10">

        <!-- 좌측 이전 핫스팟 터치 및 마우스 감지 -->
        <div onclick="GalleryManager.navigateSlide(-1)"
            class="hotspot-btn absolute left-0 top-0 w-1/4 h-full z-20 cursor-w-resize flex items-center pl-8 group transition-opacity">
            <div
                class="w-14 h-14 rounded-full bg-black/60 border border-white/15 flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-all duration-300 transform -translate-x-3 group-hover:translate-x-0 backdrop-blur-md shadow-2xl">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </div>
        </div>

        <div id="art-frame-wrapper" class="w-full h-full flex items-center justify-center relative overflow-hidden">
            <div id="art-frame" class="frame-royal-gold transition-all duration-700 relative">
                <!-- 이미지 사이즈가 스크린 밖으로 빠져나가지 않도록 강제 방어 제한 (max-h, max-w) -->
                <img id="gallery-image" src="" alt="Gallery Work"
                    class="block select-none pointer-events-none transition-all duration-500 shadow-[inset_0_4px_10px_rgba(0,0,0,0.8)] max-w-[80vw] max-h-[70vh] md:max-h-[75vh] object-contain">
            </div>
        </div>

        <!-- 우측 다음 핫스팟 터치 및 마우스 감지 -->
        <div onclick="GalleryManager.navigateSlide(1)"
            class="hotspot-btn absolute right-0 top-0 w-1/4 h-full z-20 cursor-e-resize flex items-center justify-end pr-8 group transition-opacity">
            <div
                class="w-14 h-14 rounded-full bg-black/60 border border-white/15 flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-3 group-hover:translate-x-0 backdrop-blur-md shadow-2xl">
                <i class="fa-solid fa-arrow-right text-lg"></i>
            </div>
        </div>

        <!-- 고급 미술관 소장 레이블 (미술관 플라크) -->
        <div
            class="museum-plaque ui-element absolute bottom-28 md:bottom-32 left-8 bg-[#1e1e24]/90 border border-[#c9a044]/30 text-[#e2d8c3] px-5 py-3.5 rounded-lg max-w-sm shadow-[0_15px_30px_rgba(0,0,0,0.7)] backdrop-blur-md z-30 transition-all duration-500">
            <div class="border-b border-[#c9a044]/20 pb-1.5 mb-2 flex justify-between items-center">
                <span id="plaque-artist"
                    class="text-xs uppercase tracking-widest font-semibold block text-[#c9a044]">Artist</span>
                <button onclick="GalleryManager.openEditModalFromCurrent()"
                    class="text-[#c9a044]/50 hover:text-amber-400 transition-colors pointer-events-auto">
                    <i class="fa-solid fa-pen text-[10px]"></i>
                </button>
            </div>
            <h3 id="plaque-title" class="art-title-font font-bold text-sm md:text-base text-white leading-snug">Title
            </h3>
            <div class="flex justify-between items-center mt-2 text-[10px] text-gray-400">
                <span id="plaque-details">Details</span>
                <span id="plaque-museum" class="text-[#c9a044]/80">Museum</span>
            </div>
        </div>
    </main>

    <footer
        class="ui-element absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 w-auto px-4 md:px-6 pointer-events-none">
        <div
            class="bg-black/80 backdrop-blur-2xl border border-white/10 px-6 py-3.5 rounded-2xl flex items-center gap-5 shadow-[0_20px_50px_rgba(0,0,0,0.9)] pointer-events-auto">
            <button onclick="GalleryManager.navigateSlide(-1)"
                class="text-gray-400 hover:text-white transition-colors duration-200 p-2 hover:bg-white/10 rounded-xl">
                <i class="fa-solid fa-chevron-left text-lg"></i>
            </button>

            <button id="btn-play-pause" onclick="GalleryManager.toggleSlideshow()"
                class="bg-amber-500 hover:bg-amber-400 text-slate-950 w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg shadow-amber-500/20 hover:scale-105">
                <i id="play-pause-icon" class="fa-solid fa-pause text-lg"></i>
            </button>

            <button onclick="GalleryManager.navigateSlide(1)"
                class="text-gray-400 hover:text-white transition-colors duration-200 p-2 hover:bg-white/10 rounded-xl">
                <i class="fa-solid fa-chevron-right text-lg"></i>
            </button>

            <div class="h-6 w-px bg-white/20 mx-1"></div>

            <!-- 라이트/다크모드 토글 스위치 -->
            <button onclick="GalleryManager.toggleTheme()" id="btn-theme-toggle"
                class="text-gray-400 hover:text-yellow-400 transition-colors duration-200 p-2 hover:bg-white/10 rounded-xl"
                title="전시장 조명 테마 변경">
                <i class="fa-solid fa-sun text-lg"></i>
            </button>

            <!-- 전체화면 토글 -->
            <button onclick="GalleryManager.toggleFullscreen()"
                class="text-gray-400 hover:text-white transition-colors duration-200 p-2 hover:bg-white/10 rounded-xl"
                title="전체 화면 몰입형 감상">
                <i class="fa-solid fa-expand text-lg"></i>
            </button>

            <div class="h-6 w-px bg-white/20 mx-1"></div>

            <!-- 에디팅 룸 사이드바 가동 -->
            <button onclick="GalleryManager.toggleSidebar()" id="btn-sidebar-trigger"
                class="text-amber-400 hover:text-amber-300 transition-colors duration-200 px-3 py-2 hover:bg-white/10 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                <span class="text-xs font-bold hidden md:inline">에디팅 룸</span>
            </button>
        </div>
    </footer>

    <aside id="control-sidebar"
        class="fixed right-0 top-0 h-full w-96 bg-zinc-950/98 backdrop-blur-3xl text-white shadow-3xl z-50 transform translate-x-full transition-transform duration-500 ease-in-out border-l border-white/10 flex flex-col justify-between">
        <div class="p-5 border-b border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center text-slate-950 font-bold text-sm">
                    <i class="fa-solid fa-paint-brush"></i>
                </div>
                <div>
                    <h2 class="font-bold text-sm tracking-wide text-gray-100 art-title-font">STUDIO HUB</h2>
                </div>
            </div>
            <button onclick="GalleryManager.toggleSidebar()"
                class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>

        <div class="flex-grow overflow-y-auto p-5 space-y-6">
            <!-- 다중 및 폴더 파일 일괄 업로드 섹션 -->
            <div class="space-y-3">
                <h3 class="text-[11px] font-bold uppercase text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-folder-open"></i> 다중 파일 일괄 업로드
                </h3>
                <div class="bg-white/5 p-4 rounded-xl border border-white/5 space-y-2">
                    <label class="block text-[11px] font-medium text-gray-300">컴퓨터 소장 사진 대량 등록 (다중 선택 가능)</label>
                    <div
                        class="relative flex items-center justify-center border border-dashed border-white/20 rounded-lg py-4 px-2 cursor-pointer hover:border-amber-500 bg-zinc-950/40 transition-colors">
                        <input type="file" id="local-batch-input" multiple accept="image/*"
                            class="absolute inset-0 opacity-0 cursor-pointer"
                            onchange="GalleryManager.uploadLocalFiles(event)">
                        <div class="text-center pointer-events-none">
                            <i class="fa-solid fa-images text-xl text-amber-400 mb-2"></i>
                            <p class="text-[10px] text-gray-300">클릭하여 여러 이미지 파일을 일괄 업로드</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 전시 연출 커스텀 설정 -->
            <div class="space-y-3">
                <h3 class="text-[11px] font-bold uppercase text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> 전시 연출 커스텀 설정
                </h3>
                <div class="bg-white/5 p-4 rounded-xl border border-white/5 space-y-4">
                    <!-- 주기 슬라이더 -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-[11px] text-gray-300">명화 자동 감상 주기</label>
                            <span id="interval-val-label" class="text-[10px] text-amber-400 font-bold">6초</span>
                        </div>
                        <input type="range" id="range-interval" min="2" max="30" value="6"
                            oninput="GalleryManager.changeSetting('interval', this.value)"
                            class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-amber-500">
                    </div>

                    <!-- 트랜지션 셀렉트 -->
                    <div>
                        <label class="block text-[11px] text-gray-300 mb-1">화면 전환 방식</label>
                        <select onchange="GalleryManager.changeSetting('transition', this.value)" id="sel-transition"
                            class="bg-zinc-900 border border-white/10 rounded-lg p-2 text-xs text-white w-full cursor-pointer">
                            <option value="dissolve">부드러운 페이드 디졸브</option>
                            <option value="slide">세련된 우측 슬라이드</option>
                            <option value="zoom">웅장한 줌 인-아웃</option>
                            <option value="flash">눈부신 광학 플래시</option>
                            <option value="cut">클래식 즉시 전환</option>
                        </select>
                    </div>

                    <div class="h-px bg-white/10 my-2"></div>

                    <!-- 프레임 셀렉트 -->
                    <div>
                        <label class="block text-[11px] text-gray-300 mb-1">프리미엄 장인 액자</label>
                        <select onchange="GalleryManager.changeSetting('frame', this.value)" id="sel-frame"
                            class="bg-zinc-900 border border-white/10 rounded-lg p-2 text-xs text-white w-full cursor-pointer">
                            <option value="frame-royal-gold">프랑스 왕실 골드 액자</option>
                            <option value="frame-antique-wood">이탈리아 앤틱 호두나무 액자</option>
                            <option value="frame-modern-black">시그니처 아틀리에 블랙</option>
                            <option value="frame-minimal-white">엘리트 무광 화이트</option>
                            <option value="frame-royal-crimson">크림슨 실크 벨벳</option>
                            <option value="frame-cyber-neon">사이버 메트로 네온</option>
                        </select>
                    </div>

                    <!-- 벽지 디자인 셀렉트 -->
                    <div>
                        <label class="block text-[11px] text-gray-300 mb-1">전시장 벽지 인테리어</label>
                        <select onchange="GalleryManager.changeSetting('wall', this.value)" id="sel-wall"
                            class="bg-zinc-900 border border-white/10 rounded-lg p-2 text-xs text-white w-full cursor-pointer">
                            <option value="wall-velvet-dark">시크 버건디 로열 다크</option>

            <!-- 소장품 리스트 관리 -->
            <div class="space-y-3">
                <h3 class="text-[11px] font-bold uppercase text-amber-400 flex items-center justify-between">
                    <span><i class="fa-solid fa-gem"></i> 소장품 리스트 (<span id="total-photo-count">0</span>)</span>
                    <button onclick="GalleryManager.resetToDefaults()"
                        class="text-[10px] text-amber-500 hover:text-white transition-colors">기본명화로 복원</button>
                </h3>
                <div id="sidebar-photo-list" class="space-y-2 max-h-[250px] overflow-y-auto pr-1">
                    <!-- 동적 명화 데이터 인젝션 -->
                </div>

    <!-- 작품 정보 수정을 위한 글래스모픽 팝업 모달 -->
    <div id="edit-modal"
        class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-all duration-300 pointer-events-none">
        <div
            class="bg-zinc-900 border border-white/10 rounded-2xl w-full max-w-md p-6 m-4 shadow-2xl transform scale-95 transition-all duration-300 pointer-events-auto">
            <div class="flex justify-between items-center pb-4 border-b border-white/10 mb-4">
                <h3 class="text-sm font-bold text-amber-400 art-title-font flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> 명화 라벨 데이터 수정
                </h3>
                <button onclick="GalleryManager.closeEditModal()"
                    class="text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <input type="hidden" id="edit-art-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">작품 제목</label>
                    <input type="text" id="edit-art-title"
                        class="w-full bg-zinc-950 border border-white/10 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">작가 성명</label>
                    <input type="text" id="edit-art-artist"
                        class="w-full bg-zinc-950 border border-white/10 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">재질 및 제작 연도</label>
                    <input type="text" id="edit-art-details"
                        class="w-full bg-zinc-950 border border-white/10 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">소장 박물관 위치</label>
                    <input type="text" id="edit-art-museum"
                        class="w-full bg-zinc-950 border border-white/10 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                </div>

            <div class="flex gap-2 justify-end mt-6 pt-4 border-t border-white/10">
                <button onclick="GalleryManager.closeEditModal()"
                    class="px-4 py-2 bg-white/5 hover:bg-white/10 rounded-lg text-xs text-gray-300 transition-all">취소</button>
                <button onclick="GalleryManager.saveEdit()"
                    class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition-all">정보
                    저장</button>
            </div>
        </div>
    </div>

    <!-- 비간섭 알림 피드백 토스트 컨테이너 -->
    <div id="toast-container" class="fixed bottom-28 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // ============================================================
        // Firebase 동적 로딩 (로드 실패해도 갤러리 정상 작동)
        // ============================================================
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'louvre-gallery-app';
        let firebaseConfig = null;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config ? JSON.parse(__firebase_config) : null;
        } catch (e) {
            console.warn("Firebase 설정 파싱 실패, 로컬 모드로 진행합니다.", e);
        }
        let app, db, auth, userId = null;
        let firebaseReady = false;

        // Firebase 모듈을 동적으로 로드 (실패해도 갤러리는 정상 작동)
        async function loadFirebase() {
            if (!firebaseConfig) return false;
            try {
                const [appMod, authMod, fsMod] = await Promise.all([
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
                ]);

                app = appMod.initializeApp(firebaseConfig);
                db = fsMod.getFirestore(app);
                auth = authMod.getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await authMod.signInWithCustomToken(auth, __initial_auth_token);
                    userId = cred.user.uid;
                } else {
                    const cred = await authMod.signInAnonymously(auth);
                    userId = cred.user.uid;
                }

                // Firestore 함수를 전역에 캐시
                window._fsDoc = fsMod.doc;
                window._fsGetDoc = fsMod.getDoc;
                window._fsSetDoc = fsMod.setDoc;
                firebaseReady = true;
                return true;
            } catch (e) {
                console.warn("Firebase 로드/인증 실패. 로컬 저장소 모드로 진행합니다.", e);
                return false;
            }
        }

        // ============================================================
        // localStorage 기반 사진 기억(Persistence) 엔진
        // ============================================================
        const STORAGE_KEY_IMAGES = 'gallery_saved_images';
        const STORAGE_KEY_SETTINGS = 'gallery_saved_settings';
        const STORAGE_KEY_THEME = 'gallery_saved_theme';

        function saveImagesToLocal(images) {
            try {
                localStorage.setItem(STORAGE_KEY_IMAGES, JSON.stringify(images));
            } catch (e) {
                // localStorage 용량 초과 시 사용자 안내 (data URL이 큰 경우)
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    console.warn("로컬 저장 공간이 부족합니다. 일부 이미지는 저장되지 않을 수 있습니다.");
                    // 용량 초과 시 가장 오래된 로컬 이미지부터 제거 후 재시도
                    const filtered = images.filter(img => !img.url.startsWith('data:') || img.id.startsWith('master-'));
                    try {
                        localStorage.setItem(STORAGE_KEY_IMAGES, JSON.stringify(filtered));
                    } catch (e2) {
                        console.error("저장 공간 부족: 이미지 목록을 저장할 수 없습니다.");
                    }
                }
            }
        }

        function loadImagesFromLocal() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_IMAGES);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {
                console.warn("로컬 이미지 데이터 로드 실패:", e);
            }
            return null;
        }

        function saveSettingsToLocal(settings, theme) {
            try {
                localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
                localStorage.setItem(STORAGE_KEY_THEME, theme);
            } catch (e) {
                console.warn("설정 저장 실패:", e);
            }
        }

        function loadSettingsFromLocal() {
            try {
                const settingsData = localStorage.getItem(STORAGE_KEY_SETTINGS);
                const themeData = localStorage.getItem(STORAGE_KEY_THEME);
                return {
                    settings: settingsData ? JSON.parse(settingsData) : null,
                    theme: themeData || null
                };
            } catch (e) {
                return { settings: null, theme: null };
            }
        }

        // 안정성이 보장된 고화질 Unsplash CDN 공식 대체 이미지 (CORS 프리패스 자원)
        const HISTORICAL_MASTERPIECES = [
            { id: "master-1", url: "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=1200&q=80", artist: "Unknown Classic", title: "르네상스의 여운", details: "유화 캔버스", museum: "메트로폴리탄 미술관" },
            { id: "master-2", url: "https://images.unsplash.com/photo-1544967082-d9d25d867d66?auto=format&fit=crop&w=1200&q=80", artist: "Modern Sculptor", title: "침묵의 조각상", details: "대리석 조각", museum: "루브르 박물관" },
            { id: "master-3", url: "https://images.unsplash.com/photo-1506804886640-ed0428fa6eb2?auto=format&fit=crop&w=1200&q=80", artist: "Abstract Master", title: "기하학적 환상", details: "아크릴", museum: "현대 미술관 (MoMA)" },
            { id: "master-4", url: "https://images.unsplash.com/photo-1577083165633-14cb63eb3711?auto=format&fit=crop&w=1200&q=80", artist: "Classical Architect", title: "빛의 회랑", details: "건축 사진", museum: "내셔널 갤러리" },
            { id: "master-5", url: "https://images.unsplash.com/photo-1536924940846-227afb31e2a5?auto=format&fit=crop&w=1200&q=80", artist: "Contemporary Artist", title: "혼돈 속의 질서", details: "혼합 매체", museum: "테이트 모던" }
        ];

        const GalleryManager = {
            images: [],
            currentIndex: 0,
            isPlaying: true,
            slideInterval: null,
            intervalSeconds: 6,
            isAudioPlaying: false,
            toneSynth: null,
            soundLoop: null,
            idleTimer: null,
            theme: 'dark', // 'dark' | 'light'
            settings: {
                frame: 'frame-royal-gold',
                wall: 'wall-velvet-dark',
                fillMode: 'contain',
                spotlight: 'spot-warm',
                interval: 6,
                transition: 'dissolve'
            },

            async init() {
                // 1단계: 로컬 저장소에서 설정/테마 즉시 복원 (빠른 초기화)
                const localData = loadSettingsFromLocal();
                if (localData.settings) {
                    this.settings = { ...this.settings, ...localData.settings };
                }
                if (localData.theme) {
                    this.theme = localData.theme;
                }

                // 2단계: Firebase 비동기 로드 시도 (실패해도 무관)
                const fbOk = await loadFirebase();
                if (fbOk) {
                    await this.loadSettingsFromCloud();
                }

                // 3단계: 로컬 저장소에서 이미지 목록 복원
                const savedImages = loadImagesFromLocal();
                if (savedImages && savedImages.length > 0) {
                    this.images = savedImages;
                } else {
                    this.images = [...HISTORICAL_MASTERPIECES];
                }

                this.intervalSeconds = parseInt(this.settings.interval, 10);
                this.applySettingsToDOM();
                this.render();

                window.addEventListener('resize', () => this.updateResolutionBadge());
                window.addEventListener('keydown', (e) => this.handleKeyboard(e));
                window.addEventListener('wheel', (e) => this.handleWheel(e), { passive: false });

                this.setupIdleTimer();
                this.updateResolutionBadge();
                if (this.isPlaying) this.startSlideshow();
            },

            // 이미지 변경 사항을 로컬에 자동 저장
            persistImages() {
                saveImagesToLocal(this.images);
            },

            // 설정 변경 사항을 로컬에 자동 저장
            persistSettings() {
                saveSettingsToLocal(this.settings, this.theme);
            },

            // 클라우드 저장소 연동 메서드
            async loadSettingsFromCloud() {
                if (!firebaseReady || !userId || !db) return;
                try {
                    const ref = window._fsDoc(db, 'artifacts', appId, 'users', userId, 'gallery', 'config');
                    const snap = await window._fsGetDoc(ref);
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.theme) this.theme = data.theme;
                        if (data.settings) this.settings = { ...this.settings, ...data.settings };
                    }
                } catch (e) {
                    console.warn("클라우드 설정 로드 오류 (무시됨):", e);
                }
            },

            async saveSettingsToCloud() {
                if (!firebaseReady || !userId || !db) return;
                try {
                    const ref = window._fsDoc(db, 'artifacts', appId, 'users', userId, 'gallery', 'config');
                    await window._fsSetDoc(ref, {
                        theme: this.theme,
                        settings: this.settings
                    }, { merge: true });
                } catch (e) {
                    console.warn("클라우드 설정 저장 오류 (무시됨):", e);
                }
            },

            setupIdleTimer() {
                const activityEvents = ['mousemove', 'mousedown', 'touchstart', 'keydown'];
                activityEvents.forEach(evt => window.addEventListener(evt, () => this.resetIdleTimer()));
                this.resetIdleTimer();
            },

            resetIdleTimer() {
                document.body.classList.remove('idle');
                clearTimeout(this.idleTimer);

                const sidebar = document.getElementById('control-sidebar');
                const editModal = document.getElementById('edit-modal');
                const isSidebarClosed = sidebar && sidebar.classList.contains('translate-x-full');
                const isModalClosed = editModal && editModal.classList.contains('hidden');

                if (isSidebarClosed && isModalClosed) {
                    this.idleTimer = setTimeout(() => {
                        document.body.classList.add('idle');
                    }, 3000);
                }
            },

            render() {
                if (this.images.length === 0) return;

                const imgEl = document.getElementById('gallery-image');
                if (!imgEl) return;

                const target = this.images[this.currentIndex];
                const effect = this.settings.transition || 'dissolve';

                imgEl.className = imgEl.className.replace(/effect-\w+/g, '').trim();
                imgEl.classList.add(`effect-${effect}`);
                imgEl.classList.add('hide');

                const animDuration = effect === 'cut' ? 0 : 350;

                setTimeout(() => {
                    imgEl.onerror = () => this.handleImageError(imgEl);
                    imgEl.onload = () => imgEl.classList.remove('hide');

                    if (target && target.url) {
                        imgEl.src = target.url;
                    } else {
                        this.handleImageError(imgEl);
                    }

                    const elArtist = document.getElementById('plaque-artist');
                    const elTitle = document.getElementById('plaque-title');
                    const elDetails = document.getElementById('plaque-details');
                    const elMuseum = document.getElementById('plaque-museum');
                    const elBadge = document.getElementById('slide-index-badge');

                    if (elArtist) elArtist.textContent = target.artist || "Unknown Artist";
                    if (elTitle) elTitle.textContent = target.title || "Untitled";
                    if (elDetails) elDetails.textContent = target.details || "Local Vault Asset";
                    if (elMuseum) elMuseum.textContent = target.museum || "My Virtual Studio";
                    if (elBadge) elBadge.textContent = `${this.currentIndex + 1} / ${this.images.length}`;
                }, animDuration);

                this.renderSidebarList();
            },

            uploadLocalFiles(event) {
                const files = event.target.files;
                if (!files || files.length === 0) return;

                let addedCount = 0;
                let filesProcessed = 0;
                const totalFiles = files.length;

                this.showToast("대량의 파일을 일괄 인코딩 분석 중입니다...", "info");

                Array.from(files).forEach(file => {
                    if (!file.type.startsWith('image/')) {
                        filesProcessed++;
                        if (filesProcessed === totalFiles && addedCount > 0) {
                            this.currentIndex = this.images.length - 1;
                            this.render();
                            this.persistImages(); // 로컬 저장
                        }
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const newImg = {
                            id: 'local-' + Date.now() + '-' + Math.floor(Math.random() * 10000),
                            url: e.target.result,
                            artist: "Personal Vault",
                            title: file.name.substring(0, file.name.lastIndexOf('.')) || file.name,
                            details: "로컬 일괄 전입 수집본",
                            museum: "아틀리에 개인 수장고"
                        };

                        this.images.push(newImg);
                        addedCount++;
                        filesProcessed++;

                        if (filesProcessed === totalFiles) {
                            this.currentIndex = this.images.length - 1;
                            this.render();
                            this.persistImages(); // 로컬 저장
                            this.showToast(`성공적으로 ${addedCount}개의 신규 명화 자산을 수입하였습니다.`, 'success');
                        }
                    };

                    reader.onerror = () => {
                        filesProcessed++;
                        if (filesProcessed === totalFiles) this.render();
                    };

                    reader.readAsDataURL(file);
                });

                event.target.value = '';
            },

            handleImageError(imgEl) {
                imgEl.onerror = null; // 무한 루프 방지
                const target = this.images[this.currentIndex];
                imgEl.src = `https://placehold.co/1200x800/1e1e24/ffd700?text=${encodeURIComponent(target ? target.title : "Unloaded")}`;
                imgEl.classList.remove('hide');
            },

            applyThemeClasses() {
                const body = document.body;
                const spot = document.getElementById('gallery-spotlight');
                const themeBtn = document.getElementById('btn-theme-toggle');

                // 기존 모든 벽지 스타일 초기화 클리닝
                body.className = body.className.replace(/wall-\S+/g, '').trim();

                if (this.theme === 'light') {
                    body.classList.add('wall-light-mode');
                    if (spot) spot.className = 'spotlight-overlay spot-light-mode';
                    if (themeBtn) {
                        themeBtn.innerHTML = '<i class="fa-solid fa-moon text-lg"></i>';
                        themeBtn.classList.remove('text-gray-400');
                        themeBtn.classList.add('text-indigo-400');
                    }
                } else {
                    body.classList.add(this.settings.wall);
                    if (spot) spot.className = `spotlight-overlay ${this.settings.spotlight}`;
                    if (themeBtn) {
                        themeBtn.innerHTML = '<i class="fa-solid fa-sun text-lg"></i>';
                        themeBtn.classList.remove('text-indigo-400');
                        themeBtn.classList.add('text-gray-400');
                    }
                }
            },

            toggleTheme() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                this.applyThemeClasses();
                this.persistSettings(); // 로컬 저장
                this.saveSettingsToCloud(); // 클라우드 동기화

                if (this.theme === 'light') {
                    this.showToast("화사한 라이트 전시 모드로 전환되었습니다.", "info");
                } else {
                    this.showToast("차분한 다크 감상 테마로 회귀했습니다.", "info");
                }
            },

            changeSetting(key, value) {
                this.settings[key] = value;
                if (key === 'interval') {
                    this.intervalSeconds = parseInt(value, 10);
                    const lLabel = document.getElementById('interval-val-label');
                    if (lLabel) lLabel.textContent = `${value}초`;
                    if (this.isPlaying) this.startSlideshow();
                    this.showToast(`자동 재생 주기가 ${value}초로 변경 조율되었습니다.`, 'success');
                } else if (key === 'transition') {
                    this.showToast(`화면 전환 효과가 변경되었습니다.`, 'success');
                } else {
                    this.applySettingsToDOM();
                }
                this.persistSettings(); // 로컬 저장
                this.saveSettingsToCloud(); // 설정 변경 즉시 클라우드 반영
            },

            applySettingsToDOM() {
                const frameEl = document.getElementById('art-frame');
                if (frameEl) {
                    frameEl.className = `relative flex items-center justify-center w-fit h-fit transition-all duration-700 p-[20px] ${this.settings.frame}`;
                }

                this.applyThemeClasses();

                const sFrame = document.getElementById('sel-frame');
                const sWall = document.getElementById('sel-wall');
                const sTransition = document.getElementById('sel-transition');
                const rInterval = document.getElementById('range-interval');
                const lInterval = document.getElementById('interval-val-label');

                if (sFrame) sFrame.value = this.settings.frame;
                if (sWall) sWall.value = this.settings.wall;
                if (sTransition) sTransition.value = this.settings.transition;
                if (rInterval) rInterval.value = this.settings.interval;
                if (lInterval) lInterval.textContent = `${this.settings.interval}초`;
            },

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        this.showToast("브라우저 전체 화면 전개가 허용되지 않았습니다.", "error");
                    });
                } else {
                    document.exitFullscreen();
                }
            },

            toggleSlideshow() {
                this.isPlaying = !this.isPlaying;
                const icon = document.getElementById('play-pause-icon');
                const btn = document.getElementById('btn-play-pause');
                const text = document.getElementById('slideshow-state-text');
                const ind = document.getElementById('slideshow-state-indicator');

                if (this.isPlaying) {
                    if (icon) icon.className = "fa-solid fa-pause text-lg";
                    if (btn) btn.className = "bg-amber-500 hover:bg-amber-400 text-slate-950 w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg hover:scale-105";
                    if (text) text.textContent = "자동 감상 중";
                    if (ind) ind.style.display = 'flex';
                    this.startSlideshow();
                    this.showToast("자동 명화 슬라이드 관람이 재개되었습니다.", "success");
                } else {
                    if (icon) icon.className = "fa-solid fa-play text-lg translate-x-0.5";
                    if (btn) btn.className = "bg-teal-500 hover:bg-teal-400 text-slate-950 w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg hover:scale-105";
                    if (text) text.textContent = "일시 정지됨";
                    if (ind) ind.style.display = 'none';
                    if (this.slideInterval) clearInterval(this.slideInterval);
                    this.showToast("도슨트 감상이 일시 보류되었습니다.", "warning");
                }
            },

            startSlideshow() {
                if (this.slideInterval) clearInterval(this.slideInterval);
                this.slideInterval = setInterval(() => {
                    this.navigateSlide(1);
                }, this.intervalSeconds * 1000);
            },

            navigateSlide(direction) {
                if (this.images.length === 0) return;
                this.currentIndex += direction;
                if (this.currentIndex >= this.images.length) this.currentIndex = 0;
                else if (this.currentIndex < 0) this.currentIndex = this.images.length - 1;

                this.render();
                if (this.isPlaying) this.startSlideshow();
            },

            jumpToSlide(idx) {
                this.currentIndex = idx;
                this.render();
                if (this.isPlaying) this.startSlideshow();
            },

            renderSidebarList() {
                const container = document.getElementById('sidebar-photo-list');
                const totalC = document.getElementById('total-photo-count');
                if (!container) return;

                if (totalC) totalC.textContent = this.images.length;
                container.innerHTML = "";

                this.images.forEach((img, idx) => {
                    const item = document.createElement('div');
                    item.className = `flex items-center justify-between p-2 rounded-xl border transition-colors ${idx === this.currentIndex ? 'bg-amber-500/20 border-amber-500' : 'bg-zinc-900 border-white/5 hover:border-white/20'}`;

                    // 썸네일 URL: data URL이 너무 길면 placeholder 사용 (DOM 성능 보호)
                    const thumbUrl = img.url && img.url.length < 200000 ? img.url : (img.url && img.url.startsWith('data:') ? img.url.substring(0, 100) + '...' : img.url);
                    const thumbSrc = img.url && img.url.length > 200000 ? 'https://placehold.co/40/1e1e24/ffd700?text=' + encodeURIComponent((img.title || 'IMG').substring(0, 3)) : img.url;

                    item.innerHTML = `
                        <div onclick="GalleryManager.jumpToSlide(${idx})" class="flex items-center gap-3 cursor-pointer flex-grow overflow-hidden">
                            <img src="${thumbSrc}" class="w-10 h-10 object-cover rounded bg-zinc-800" onerror="this.src='https://placehold.co/40?text=Err'">
                            <div class="truncate">
                                <h4 class="text-xs font-semibold text-gray-100 truncate">${img.title}</h4>
                                <p class="text-[9px] text-amber-500/80 truncate">${img.artist}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-0.5">
                            <button onclick="GalleryManager.openEditModal('${img.id}')" class="text-gray-500 hover:text-amber-400 p-2" title="이름 및 연도 등 상세 수정">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="GalleryManager.deleteImage('${img.id}')" class="text-gray-500 hover:text-red-400 p-2" title="전시 목록에서 출고">
                                <i class="fa-solid fa-trash-alt text-xs"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            },

            deleteImage(id) {
                const idx = this.images.findIndex(img => img.id === id);
                if (idx > -1) {
                    this.images.splice(idx, 1);
                    if (this.currentIndex >= this.images.length) this.currentIndex = Math.max(0, this.images.length - 1);
                    this.render();
                    this.persistImages(); // 로컬 저장
                    this.showToast("해당 명화를 수장고에서 영구 제외했습니다.", "warning");
                }
            },

            openEditModalFromCurrent() {
                if (this.images.length > 0) {
                    this.openEditModal(this.images[this.currentIndex].id);
                }
            },

            openEditModal(id) {
                const item = this.images.find(img => img.id === id);
                if (!item) return;

                document.getElementById('edit-art-id').value = item.id;
                document.getElementById('edit-art-title').value = item.title || '';
                document.getElementById('edit-art-artist').value = item.artist || '';
                document.getElementById('edit-art-details').value = item.details || '';
                document.getElementById('edit-art-museum').value = item.museum || '';

                const modal = document.getElementById('edit-modal');
                modal.classList.remove('hidden', 'pointer-events-none');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.querySelector('div').classList.remove('scale-95');
                }, 10);
            },

            closeEditModal() {
                const modal = document.getElementById('edit-modal');
                modal.classList.add('opacity-0');
                modal.querySelector('div').classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden', 'pointer-events-none');
                }, 300);
            },

            saveEdit() {
                const id = document.getElementById('edit-art-id').value;
                const title = document.getElementById('edit-art-title').value.trim();
                const artist = document.getElementById('edit-art-artist').value.trim();
                const details = document.getElementById('edit-art-details').value.trim();
                const museum = document.getElementById('edit-art-museum').value.trim();

                const index = this.images.findIndex(img => img.id === id);
                if (index !== -1) {
                    this.images[index].title = title || "무제";
                    this.images[index].artist = artist || "작가 미상";
                    this.images[index].details = details || "정보 미표기";
                    this.images[index].museum = museum || "프라이빗 소장";

                    this.render();
                    this.persistImages(); // 로컬 저장
                    this.showToast("명화의 라벨 정보를 업데이트 완료했습니다.", "success");
                    this.closeEditModal();
                }
            },

            resetToDefaults() {
                this.images = [...HISTORICAL_MASTERPIECES];
                this.currentIndex = 0;
                this.render();
                this.persistImages(); // 로컬 저장 (초기화 상태도 기억)
                this.showToast("박물관 정품 연계 기본 컬렉션으로 복구되었습니다.", "info");
            },

            toggleSidebar() {
                const sidebar = document.getElementById('control-sidebar');
                if (sidebar) sidebar.classList.toggle('translate-x-full');
            },

            updateResolutionBadge() {
                const badge = document.getElementById('resolution-badge');
                if (badge) badge.innerHTML = `<i class="fa-solid fa-display text-amber-400 mr-1.5"></i>${window.innerWidth}x${window.innerHeight}`;
            },

            handleKeyboard(e) {
                if (e.key === "ArrowLeft") this.navigateSlide(-1);
                else if (e.key === "ArrowRight") this.navigateSlide(1);
                else if (e.key === " ") {
                    e.preventDefault();
                    this.toggleSlideshow();
                }
            },

            lastWheelTime: 0,
            handleWheel(e) {
                const now = Date.now();
                if (now - this.lastWheelTime < 700) return;
                if (e.deltaY > 0) { this.navigateSlide(1); this.lastWheelTime = now; }
                else if (e.deltaY < 0) { this.navigateSlide(-1); this.lastWheelTime = now; }
            },

            toggleAmbientMusic() {
                if (this.isAudioPlaying) {
                    if (this.soundLoop) this.soundLoop.stop();
                    Tone.Transport.stop();
                    this.isAudioPlaying = false;
                    document.getElementById('ambient-wave').classList.add('hidden');
                    document.getElementById('btn-ambient-toggle').classList.remove('bg-amber-500', 'text-black');
                    this.showToast("고요한 명상 가이드 연주를 종료합니다.", "info");
                } else {
                    Tone.start();
                    const reverb = new Tone.Reverb({ decay: 5, wet: 0.6 }).toDestination();
                    this.toneSynth = new Tone.PolySynth(Tone.Synth, {
                        envelope: { attack: 1.5, decay: 1.0, sustain: 0.8, release: 3.5 }
                    }).connect(reverb);
                    this.toneSynth.volume.value = -18;
                    const notes = ["C3", "E3", "G3", "A3", "C4"];
                    this.soundLoop = new Tone.Loop(time => {
                        if (Math.random() > 0.3) {
                            this.toneSynth.triggerAttackRelease([notes[Math.floor(Math.random() * 5)]], "2n", time);
                        }
                    }, "2m").start(0);
                    Tone.Transport.start();

                    this.isAudioPlaying = true;
                    document.getElementById('ambient-wave').classList.remove('hidden');
                    document.getElementById('btn-ambient-toggle').classList.add('bg-amber-500', 'text-black');
                    this.showToast("자체 앰비언트 힐링 연주가 시작되었습니다.", "success");
                }
            },

            showToast(msg, type = "info") {
                const c = document.getElementById('toast-container');
                if (!c) return;
                const t = document.createElement('div');
                let ic = "fa-circle-info text-blue-400";
                if (type === "success") ic = "fa-circle-check text-emerald-400";
                if (type === "warning") ic = "fa-triangle-exclamation text-amber-400";
                if (type === "error") ic = "fa-circle-xmark text-rose-400";

                t.className = `flex items-center gap-3 bg-zinc-900/95 text-white text-xs px-4 py-3.5 rounded-xl border border-white/10 shadow-3xl backdrop-blur-md transition-all duration-300`;
                t.innerHTML = `<i class="fa-solid ${ic} text-sm"></i><span class="font-medium">${msg}</span>`;
                c.appendChild(t);

                setTimeout(() => {
                    t.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => t.remove(), 300);
                }, 3000);
            }
        };

        // 전역 스코프에 연결
        window.GalleryManager = GalleryManager;
        window.onload = () => GalleryManager.init();

    </script>
</body>

</html>
